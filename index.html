        :root {
            --bg: #08080a; --text: #ffffff; --card: #16161a; --sep-color: rgba(255,255,255,0.2);
            --digit-size: clamp(80px, min(23vw, 40vh), 500px);
            --ease: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        [data-theme="light"] { --bg: #fdfdfd; --text: #0a0a0c; --card: #f1f1f4; --sep-color: rgba(0,0,0,0.15); }
        [data-theme="amoled"] { --bg: #000000; --text: #ffffff; --card: #111114; --sep-color: rgba(255,255,255,0.3); }

        html {
            height: 100%;
            overflow: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        html::-webkit-scrollbar { display: none; width: 0; height: 0; }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-font-smoothing: antialiased; font-family: 'Fredoka', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            outline: none; touch-action: manipulation;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        *::-webkit-scrollbar { display: none; width: 0; height: 0; }

        body {
            background: var(--bg); color: var(--text); 
            height: 100dvh; max-height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
            transition: background 0.4s ease, color 0.4s ease;
            padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
        }

        .top-nav { height: 65px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; flex-shrink: 0; padding: 0 10px; }
        .icon-btn { width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--card); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .icon-btn:active { transform: scale(0.9); }

        .stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; width: 100%; cursor: pointer; }
        .time-row { display: flex; align-items: center; justify-content: center; gap: 0.6vw; width: fit-content; max-width: 100%; pointer-events: none; }
        .digit-box { position: relative; height: var(--digit-size); width: calc(var(--digit-size) * 0.88); overflow: visible; display: flex; justify-content: center; align-items: center; }
        svg.digit { display: block; width: 100%; height: 100%; overflow: visible; color: var(--text); position: relative; z-index: 1; }
        svg.digit .flip { transform: scale(1, -1); transform-origin: 0 0; }
        svg.digit path { fill: currentColor; }
        .curtain { display: none; }

        .colon { height: var(--digit-size); width: calc(var(--digit-size) * 0.22); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--digit-size) * 0.16); }
        .colon span { width: calc(var(--digit-size) * 0.1); height: calc(var(--digit-size) * 0.1); border-radius: 50%; background: var(--sep-color); flex-shrink: 0; }

        .separator { font-family: 'Fredoka', sans-serif; font-size: calc(var(--digit-size) * 0.5); color: var(--sep-color); font-weight: 400; line-height: 1; }
        
        .sec-group { display: none; align-items: center; opacity: 0.5; }
        .sec-group .digit-box { height: calc(var(--digit-size) * 0.6); width: calc(var(--digit-size) * 0.48); }

        @media (orientation: landscape) and (max-height: 500px) {
            body.has-seconds { --digit-size: 52vh; }
            body:not(.has-seconds) { --digit-size: 75vh; }
            .top-nav, .dock { display: none !important; }
            body { padding: 0; }
        }

        body.has-seconds { --digit-size: clamp(64px, min(19vw, 33vh), 380px); }
        body.has-ampm { --digit-size: clamp(64px, min(20vw, 35vh), 400px); }
        #ampm { font-family: 'NStyle04', 'Fredoka', sans-serif; font-size: clamp(0.9rem, 3.5vw, 1.6rem); font-weight: 400; color: var(--sep-color); margin-left: 8px; }

        .dock { width: 100%; max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; padding-bottom: 20px; }
        .segmented { background: var(--card); padding: 5px; border-radius: 100px; display: flex; }
        .seg-btn { flex: 1; border: none; background: transparent; color: var(--text); padding: 12px 4px; border-radius: 100px; font-weight: 700; opacity: 0.3; font-size: clamp(0.62rem, 2.6vw, 0.85rem); white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .seg-btn.active { background: var(--bg); opacity: 1; }
        .btn-row { display: flex; gap: 10px; }
        .btn { background: var(--card); color: var(--text); border: none; height: 64px; border-radius: 20px; display: flex; align-items: center; justify-content: center; flex: 1; cursor: pointer; transition: 0.2s; }
        .btn-main { flex: 2; background: var(--text); color: var(--bg); }

        .overlay { position: fixed; inset: 0; background: var(--bg); display: none; z-index: 3000; flex-direction: column; animation: fadeIn 0.3s ease; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
        .overlay-close { position: absolute; top: calc(env(safe-area-inset-top) + 20px); left: 20px; z-index: 3001; }
        .overlay-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; gap: 8px; }
        .edit-title { font-size: clamp(1.2rem, 5vw, 1.7rem); font-weight: 700; opacity: 0.6; margin-bottom: 24px; }
        .counter-group { background: var(--card); padding: clamp(40px, 10vw, 80px) clamp(30px, 8vw, 60px); border-radius: 48px; display: flex; align-items: center; gap: clamp(12px, 3vw, 24px); width: min(100%, 800px); justify-content: center; }
        .counter-col { display: flex; flex-direction: column; align-items: center; gap: 16px; flex: 1; min-width: 0; overflow: visible; }
        .timer-input {
            font-family: 'NStyle04', 'Fredoka', sans-serif; background: transparent; border: none; color: var(--text);
            font-size: clamp(3.5rem, 18vw, 8rem); font-weight: 400; width: 100%; max-width: 100%; text-align: center; overflow: visible;
            -moz-appearance: textfield; letter-spacing: 0.12em;
        }
        .timer-input::-webkit-outer-spin-button, .timer-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .unit-label { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.35; margin-top: -12px; }
        .counter-group .separator { font-size: clamp(2rem, 8vw, 3.5rem); flex-shrink: 0; }

        @keyframes digitIn { from { opacity: 0.15; transform: translateY(6%); } to { opacity: 1; transform: translateY(0); } }
        .live-laps { display: none; flex-direction: column; gap: 8px; width: 100%; max-width: 450px; margin: 0 auto; max-height: 20vh; overflow-y: auto; padding: 0 10px 10px; flex-shrink: 0; }
        .lap-row { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px 18px; border-radius: 16px; font-size: 0.85rem; animation: digitIn 0.25s cubic-bezier(0.22, 1, 0.36, 1); }
        .lap-row .lap-n { opacity: 0.4; font-weight: 700; letter-spacing: 0.05em; }
        .lap-row .lap-t { font-family: 'NStyle04', monospace; font-weight: 400; }
        .step-btn { width: 58px; height: 58px; border: none; background: var(--bg); color: var(--text); border-radius: 20px; font-size: 1.6rem; cursor: pointer; touch-action: none; flex-shrink: 0; }
        .confirm-btn { width: 100%; max-width: 340px; padding: 20px; border-radius: 100px; border: none; background: var(--text); color: var(--bg); font-weight: 700; font-size: 1.05rem; cursor: pointer; }

        .setting-item { width: 100%; max-width: 360px; display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 20px 24px; border-radius: 24px; margin-bottom: 10px; }
        .toggle { width: 48px; height: 26px; position: relative; }
        .toggle input { opacity: 0; width: 0; }
        .slider { position: absolute; inset: 0; background: rgba(128,128,128,0.2); border-radius: 34px; transition: 0.3s; cursor: pointer; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.3s; }
        input:checked + .slider { background: #34c759; }
        input:checked + .slider:before { transform: translateX(22px); }

        #toast { position: fixed; top: 30px; left: 50%; transform: translate(-50%, -20px); background: var(--text); color: var(--bg); padding: 12px 24px; border-radius: 100px; font-weight: 700; opacity: 0; transition: 0.4s var(--ease); z-index: 5000; font-size: 0.85rem; pointer-events: none; }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        svg { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    </style>
</head>

    </footer>

    <div id="edit-panel" class="overlay">
        <button class="icon-btn overlay-close" onclick="closeModal('edit-panel')"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <div class="overlay-content">
            <div class="edit-title" id="edit-title">Focus Duration</div>
            <div class="counter-group">
                <div class="counter-col">
                    <button class="step-btn" onpointerdown="hold(event, 'h-in', 1)" onpointerup="stopHold()" onpointerleave="stopHold()">+</button>
                    <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="h-in" class="timer-input" value="0" oninput="clampInput(this,23)">
                    <span class="unit-label">hr</span>
                    <button class="step-btn" onpointerdown="hold(event, 'h-in', -1)" onpointerup="stopHold()" onpointerleave="stopHold()">−</button>
                </div>
                <div class="separator" style="opacity:0.5;">:</div>
                <div class="counter-col">
                    <button class="step-btn" onpointerdown="hold(event, 'm-in', 1)" onpointerup="stopHold()" onpointerleave="stopHold()">+</button>
                    <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="m-in" class="timer-input" value="25" oninput="clampInput(this,59)">
                    <span class="unit-label">min</span>
                    <button class="step-btn" onpointerdown="hold(event, 'm-in', -1)" onpointerup="stopHold()" onpointerleave="stopHold()">−</button>
                </div>
            </div>
            <div style="display:flex; gap:16px; width: 100%; max-width: 400px; margin-top: 44px;">
                <button class="btn" style="border-radius:100px; height: 60px; font-weight:700; font-size: 1.05rem;" onclick="resetEdit()">Reset</button>
                <button class="confirm-btn" style="margin-top:0; height: 60px; flex:2;" onclick="saveEdit()">Apply Changes</button>
            </div>
        </div>
    </div>

    <div id="settings-panel" class="overlay">
        <button class="icon-btn overlay-close" onclick="closeModal('settings-panel')"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <div class="overlay-content">
            <div class="setting-item"><b>Show Seconds</b><label class="toggle"><input type="checkbox" id="tog-sec" onchange="syncPrefs()"><span class="slider"></span></label></div>
            <div class="setting-item"><b>Show AM/PM</b><label class="toggle"><input type="checkbox" id="tog-ampm" onchange="syncPrefs()"><span class="slider"></span></label></div>
            <button class="confirm-btn" style="margin-top: 44px;" onclick="closeModal('settings-panel')">Done</button>
        </div>
    </div>

    <script>
        let app = { f: 1500, b: 300, mode: 'focus', left: 1500, active: false, s_sec: true, s_ampm: false, h_int: null, h_speed: 250,
            sw: { running: false, startTs: 0, accum: 0, laps: [] }, sw_int: null };
        const chime = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
        chime.volume = 1.0;

        const DIGIT_PATHS = {'0':'M853 922Q926 920 974.0 872.0Q1022 824 1024 751V273Q1022 201 974.0 152.5Q926 104 853 103H171Q98 104 50.0 152.5Q2 201 0 273V751Q2 824 50.0 872.0Q98 920 171 922H853Q853 922 853 922ZM201 722Q201 696 201 512V302H813V722H201Q201 722 201 722Z','1':'M615 922Q615 883 615 611V301H1025V103H1V301H410V717H205V922H615Q615 922 615 922Z','2':'M1024 598Q1022 516 967.0 461.0Q912 406 830 404H201V302H1024V103H194Q113 104 58.5 157.5Q4 211 0 292V404Q2 487 57.0 541.5Q112 596 194 598H813V728H1024V598Q1024 598 1024 598ZM830 922Q912 920 967.0 865.0Q1022 810 1024 728H201V922H830Q830 922 830 922Z','3':'M816 922Q903 919 961.5 862.5Q1020 806 1024 720V310Q1022 225 966.5 167.5Q911 110 828 103H0V301H815V414H210V611H815V732H0V922H816Q816 922 816 922Z','4':'M1025 103Q1011 103 916 103H808V412H207Q119 414 61.0 472.5Q3 531 1 619V922H207V622H808V922H1025V103Q1025 103 1025 103Z','5':'M1 598Q3 516 57.5 461.0Q112 406 195 404H824V302H1V103H830Q913 105 967.5 159.5Q1022 214 1025 297V404Q1022 487 967.5 541.5Q913 596 830 598H212V728H1V598Q1 598 1 598ZM195 922Q112 920 57.5 865.0Q3 810 1 728H824V922H195Q195 922 195 922Z','6':'M214 103Q213 103 210 103H207Q119 105 60.5 163.5Q2 222 0 310V715Q2 803 60.5 861.0Q119 919 207 922H819V715H214V103Q214 103 214 103ZM819 616Q906 613 964.0 555.5Q1022 498 1024 411V307Q1022 220 964.0 162.5Q906 105 819 103H214V310H819V409H214V616H819Q819 616 819 616Z','7':'M1024 103Q1011 103 917 103H811V732H0V922H819Q906 920 964.0 862.0Q1022 804 1024 717V103Q1024 103 1024 103Z','8':'M817 922Q904 920 962.0 863.0Q1020 806 1024 720L1025 310Q1022 222 963.5 163.5Q905 105 817 103H197Q113 105 58.0 160.0Q3 215 1 299V717Q3 804 60.5 862.0Q118 920 205 922H817Q817 922 817 922ZM214 302Q251 302 512 302H811V409H214V302Q214 302 214 302ZM214 616Q251 616 512 616H811V715H214V616Q214 616 214 616Z','9':'M810 409Q772 409 508 409H205Q118 411 60.0 468.5Q2 526 0 613V717Q2 804 60.0 862.0Q118 920 205 922H817Q903 920 961.5 863.0Q1020 806 1024 720V310Q1022 222 963.5 163.5Q905 105 817 103H201V302H810V409Q810 409 810 409ZM205 616Q243 616 508 616H810V715H205V616Q205 616 205 616Z'};

        function setDigitSVG(el, ch, animate) {
            const path = el.querySelector('path');
            path.setAttribute('d', DIGIT_PATHS[ch] || '');

            if (animate) {
                el.style.transition = 'none';
                el.style.opacity = '0';
                el.style.transform = 'translateY(-22%) scale(0.96)';
                void el.getBoundingClientRect();
                el.style.transition = 'transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease';
                el.style.transform = 'translateY(0) scale(1)';
                el.style.opacity = '1';
            } else {
                el.style.transition = 'none';
                el.style.transform = 'translateY(0) scale(1)';
                el.style.opacity = '1';
            }
        }

        window.onload = () => {
            app.s_sec = localStorage.getItem('s_sec') !== 'false';
            app.s_ampm = localStorage.getItem('s_ampm') === 'true';
            document.getElementById('tog-sec').checked = app.s_sec;
            document.getElementById('tog-ampm').checked = app.s_ampm;
            setMode('focus');
            setInterval(tick, 1000);
        };

        function handleGlobalClick(e) {
            if (e.target.closest('.stage')) {
                if (app.mode === 'stopwatch') {
                    toggleStopwatch();
                    return;
                }
                if (window.innerHeight < 500) {
                    toggleTimer();
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (app.mode !== 'stopwatch') return;
            if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault(); toggleStopwatch(); }
            else if (e.key === 'l' || e.key === 'L') { swLap(); }
            else if (e.key === 'r' || e.key === 'R') { swReset(); }
        });

        function toggleFS() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(()=>{});
            } else {
                document.exitFullscreen().catch(()=>{});
            }
        }

        function tick() {
            let h, m, s, isPomoHour = false;
            if (app.mode === 'stopwatch') return;
            if (app.mode === 'clock') {
                const n = new Date(); h = n.getHours(); m = n.getMinutes(); s = n.getSeconds();
                document.getElementById('ampm').textContent = h >= 12 ? 'PM' : 'AM';
                document.getElementById('ampm').style.display = app.s_ampm ? 'block' : 'none';
                h = h % 12 || 12;
                document.getElementById('c-sec').style.display = app.s_sec ? 'flex' : 'none';
                document.getElementById('p-sec').style.display = 'none';
            } else {
                if (app.active && app.left > 0) {
                    app.left--;
                    if (app.left === 0) { 
                        app.active = false; updateIcon(); chime.play().catch(()=>{});
                        if (app.mode === 'focus') { 
                            showToast("FOCUS DONE!"); 
                            setTimeout(() => { setMode('break'); app.active = true; updateIcon(); }, 1500); 
                        } else { 
                            showToast("BREAK DONE!"); 
                            setTimeout(() => { setMode('focus'); }, 1500); 
                        }
                    }
                }
                if (app.left >= 3600) { h = Math.floor(app.left/3600); m = Math.floor((app.left%3600)/60); isPomoHour=true; }
                else { h = Math.floor(app.left/60); m = app.left%60; }
                s = app.left % 60;
                document.getElementById('ampm').style.display = 'none';
                document.getElementById('c-sec').style.display = 'none';
                document.getElementById('p-sec').style.display = isPomoHour ? 'flex' : 'none';
            }
            updateScaling();
            render(h, m, s);
        }

        function updateScaling() {
            const isClock = app.mode === 'clock';
            const showSec = (isClock && app.s_sec) || (!isClock && app.mode !== 'stopwatch' && app.left >= 3600) || app.mode === 'stopwatch';
            document.body.classList.toggle('has-seconds', showSec);
            document.body.classList.toggle('has-ampm', isClock && app.s_ampm);
        }

        function render(v1, v2, v3) {
            const vals = [Math.floor(v1/10), v1%10, Math.floor(v2/10), v2%10, Math.floor(v3/10), v3%10];
            const ids = ['d1', 'd2', 'd3', 'd4', 'd5', 'd6', 'sd1', 'sd2'];
            const map = [...vals, vals[4], vals[5]];
            const fastIds = (app.mode === 'stopwatch') ? { sd1: true, sd2: true } : {};
            ids.forEach((id, i) => {
                const el = document.getElementById(id);
                const ch = String(map[i]);
                if (el && el.dataset.val !== ch) {
                    el.dataset.val = ch;
                    setDigitSVG(el, ch, !fastIds[id]);
                }
            });
        }

        function setMode(m) {
            app.mode = m; app.active = false;
            document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(m[0]+'-tab').classList.add('active');
            document.getElementById('gear-btn').style.visibility = (m==='clock') ? 'visible' : 'hidden';
            document.getElementById('timer-ctrl').style.display = (m==='focus' || m==='break') ? 'flex' : 'none';
            document.getElementById('sw-ctrl').style.display = (m==='stopwatch') ? 'flex' : 'none';
            document.getElementById('c-sec').style.display = 'none';
            document.getElementById('p-sec').style.display = 'none';
            document.getElementById('ampm').style.display = 'none';
            document.querySelector('#p-sec .separator').textContent = (m==='stopwatch') ? '.' : ':';
            if (m === 'stopwatch') {
                renderSW();
                renderLaps();
                updateSwButtonStates();
            } else {
                document.getElementById('live-laps').style.display = 'none';
                resetTimer();
            }
        }

        function swElapsed() { return app.sw.accum + (app.sw.running ? Date.now() - app.sw.startTs : 0); }

        function toggleStopwatch() {
            if (app.sw.running) {
                app.sw.accum += Date.now() - app.sw.startTs;
                app.sw.running = false;
                clearInterval(app.sw_int);
            } else {
                app.sw.startTs = Date.now();
                app.sw.running = true;
                app.sw_int = setInterval(() => { if (app.mode === 'stopwatch') renderSW(); }, 31);
            }
            updateSwPlayIcon(); updateSwButtonStates(); renderSW();
        }

        function swLap() {
            if (!app.sw.running) return;
            app.sw.laps.unshift({ n: app.sw.laps.length + 1, t: swElapsed() });
            renderLaps();
        }

        function swReset() {
            if (app.sw.running) { app.sw.running = false; clearInterval(app.sw_int); }
            app.sw.accum = 0; app.sw.laps = [];
            updateSwPlayIcon(); updateSwButtonStates(); renderSW(); renderLaps();
        }

        function updateSwPlayIcon() {
            document.getElementById('sw-play-icon').innerHTML = app.sw.running
                ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/>'
                : '<path d="M5 3l14 9-14 9V3z" fill="currentColor"/>';
        }

        function updateSwButtonStates() {
            const lapBtn = document.getElementById('sw-lap-btn');
            const resetBtn = document.getElementById('sw-reset-btn');
            const hasTime = app.sw.running || swElapsed() > 0 || app.sw.laps.length > 0;
            lapBtn.style.opacity = app.sw.running ? '1' : '0.3';
            lapBtn.style.pointerEvents = app.sw.running ? 'auto' : 'none';
            resetBtn.style.opacity = hasTime ? '1' : '0.3';
            resetBtn.style.pointerEvents = hasTime ? 'auto' : 'none';
        }

        function renderSW() {
            const ms = swElapsed();
            const cs = Math.floor(ms / 10) % 100;
            const totalSec = Math.floor(ms / 1000);
            const s = totalSec % 60;
            const m = Math.floor(totalSec / 60) % 100;
            document.getElementById('p-sec').style.display = 'flex';
            render(m, s, cs);
        }

        function renderLaps() {
            const list = document.getElementById('live-laps');
            if (app.mode !== 'stopwatch' || app.sw.laps.length === 0) {
                list.style.display = 'none';
                list.innerHTML = '';
                return;
            }
            list.style.display = 'flex';
            list.innerHTML = app.sw.laps.map(l => `<div class="lap-row"><span class="lap-n">LAP ${l.n}</span><span class="lap-t">${fmtLap(l.t)}</span></div>`).join('');
        }

        function fmtLap(ms) {
            const cs = Math.floor(ms / 10) % 100;
            const totalSec = Math.floor(ms / 1000);
            const s = totalSec % 60;
            const m = Math.floor(totalSec / 60);
            const pad = (n) => String(n).padStart(2, '0');
            return `${pad(m)}:${pad(s)}.${pad(cs)}`;
        }

        function resetTimer() { app.left = (app.mode==='focus' ? app.f : app.b); app.active = false; updateIcon(); tick(); }
        function toggleTimer() { app.active = !app.active; updateIcon(); }
        function updateIcon() { document.getElementById('play-icon').innerHTML = app.active ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/>' : '<path d="M5 3l14 9-14 9V3z" fill="currentColor"/>'; }
        
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function openEditPanel() {
            const secs = app.mode === 'break' ? app.b : app.f;
            document.getElementById('edit-title').textContent = app.mode === 'break' ? 'Break Duration' : 'Focus Duration';
            document.getElementById('h-in').value = Math.floor(secs / 3600);
            document.getElementById('m-in').value = Math.floor((secs % 3600) / 60);
            openModal('edit-panel');
        }

        function resetEdit() {
            const secs = app.mode === 'break' ? app.b : app.f;
            document.getElementById('h-in').value = Math.floor(secs / 3600);
            document.getElementById('m-in').value = Math.floor((secs % 3600) / 60);
        }

        function clampInput(el, max) {
            let v = el.value.replace(/[^0-9]/g, '').slice(0, 2);
            if (v !== '') v = String(Math.min(max, parseInt(v)));
            el.value = v;
        }

        function saveEdit() {
            const h = Math.min(23, Math.max(0, parseInt(document.getElementById('h-in').value) || 0));
            const m = Math.min(59, Math.max(0, parseInt(document.getElementById('m-in').value) || 0));
            const secs = h * 3600 + m * 60;
            if (app.mode === 'break') app.b = secs; else app.f = secs;
            closeModal('edit-panel'); resetTimer();
        }

        function hold(e, id, d) {
            clearTimeout(app.h_int);
            app.h_speed = 250;
            const step = () => {
                stepDuration(id, d);
                app.h_speed = Math.max(40, app.h_speed - 25);
                app.h_int = setTimeout(step, app.h_speed);
            };
            step();
        }
        function stopHold() { clearTimeout(app.h_int); }

        function stepDuration(id, d) {
            const hEl = document.getElementById('h-in');
            const mEl = document.getElementById('m-in');
            let h = parseInt(hEl.value) || 0;
            let m = parseInt(mEl.value) || 0;
            if (id === 'm-in') {
                m += d;
                if (m > 59) { m = 0; h = Math.min(23, h + 1); }
                else if (m < 0) { if (h > 0) { h -= 1; m = 59; } else { m = 0; } }
            } else {
                h = Math.min(23, Math.max(0, h + d));
            }
            hEl.value = h; mEl.value = m;
        }

        function syncPrefs() {
            app.s_sec = document.getElementById('tog-sec').checked;
            app.s_ampm = document.getElementById('tog-ampm').checked;
            localStorage.setItem('s_sec', app.s_sec);
            localStorage.setItem('s_ampm', app.s_ampm);
        }

        function toggleTheme() {
            const themes = ['dark', 'light', 'amoled'];
            const cur = document.documentElement.getAttribute('data-theme');
            const next = themes[(themes.indexOf(cur) + 1) % themes.length];
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            document.getElementById('theme-color-meta').setAttribute('content', THEME_BG[next]);
            showToast(`${next.toUpperCase()} THEME`);
        }

        function showToast(m) {
            const t = document.getElementById('toast'); t.textContent = m;
            t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000);
        }
    </script>
